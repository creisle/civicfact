[tool.poetry]
authors = ["Caralyn Reisle <creisle@bcgsc.ca>"]
description = ""
name = "llm-testing"
packages = [
  {include = "prompting", from = "src"},
  {include = "utils", from = "src"},
  {include = "evidence_retrieval", from = "src"},
  {include = "claim_verification", from = "src"},
  {include = "api", from = "src"},
]
readme = "README.md"
version = "0.1.0"

[tool.poetry.dependencies]
accelerate = "1.13.0"
bitsandbytes = "^0.49.2"
bm25s = "^0.2.13"
datasets = "^4.8.5"
deepspeed = "^0.15.0"
evaluate = "^0.4.6"
faiss-cpu = "^1.13.2"
numpy="<2.4.0"  # required by turboquant
openai = "1.84.0"
pandas="^3.0.3"
peft = "0.12.0"
pulp ="<2.3.1"
pydot = "^4.0.0"
pysbd = "^0.3.4"
pysqlite3-binary = "^0.5.3.post1"
pytest = "^9.0.2"
python = ">=3.11,<3.13" # numpy doesn't support higher python yet
rouge-score = "^0.1.2"
safetensors = "^0.4.2"
scipy = "^1.14.1"
seaborn = "^0.13.0"
sentence-transformers ={version="5.5.0", extras=['image']}
sentencepiece = "^0.2.0"
snakemake = "7.32.4"
tensorboard = "^2.15.2"
torch = "2.11.0" # { version = ">=2.0.0, !=2.0.1, !=2.1.0" } # https://github.com/pytorch/pytorch/issues/100974
transformers = {version="5.8.0", extras=["torch"]}
upsetplot = "^0.9.0"
xformers = "^0.0.35"
tokenizers = "^0.22.2"
huggingface-hub = "^1.14.0"
backoff = "^2.2.1"
trl = "^1.4.0"
google-genai = "^2.8.0"
turboquant = "^0.2.0"
compressed-tensors = "^0.17.0"

[tool.poetry.group.dev.dependencies]
black = "^23.11.0"
flake8 = "^6.1.0"
isort = "^5.12.0"
jupyter = "^1.1.1"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[[tool.poetry.source]]
name = "nvidia"
priority = "supplemental"
url = "https://pypi.nvidia.com"

[tool.black]
line-length = 120

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core"]
