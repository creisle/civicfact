[tool.poetry]
name = "civicfact data builder"
version = "0.1.0"
description = ""
authors = ["Caralyn Reisle <creisle@bcgsc.ca>"]
packages = [
    { include = "hypothesis", from = "src" },
    { include = "civic", from = "src" },
    { include = "figutils", from = "src" },
    { include = "article_utils", from = "src" },
    { include = "nli", from = "src" },
    { include = "sentence_pairs", from = "src" },
    { include = "pubtator", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
requests = "<2.29.0"
pandas = "^2.2.3"
numpy = "^1.21.4"
matplotlib = "^3.5.0"
seaborn = "^0.13.2"
ratelimit = "^2.2.1"
bioc = "^2.0"
requests-cache = "^0.9.0"
psycopg2-binary = "^2.9.3"
Unidecode = "^1.3.4"
pysbd = "^0.3.4"
bioconverters = { path = "../bioconverters/bioconverters-1.0.3.tar.gz" }
xmltodict = "^0.13.0"
backoff = "^2.2.1"
scipy = "^1.10.1"
UpSetPlot = "^0.8.0"
snakemake = "^8.20.6"
jupyter = "^1.0.0"
python-dotenv = "^1.0.1"
thefuzz = "^0.22.1"
tqdm = "^4.66.4"
plotly = "^6.3.0"
rapidfuzz = "^3.14.5"
scikit-learn = "^1.6.1"
requests-toolbelt = "^1.0.0"
networkx = "3.5"
deepdiff = "^8.6.1"

[tool.poetry.group.dev.dependencies]
dd = "^0.5.6"
isort = "^5.10.1"
pytest = "^6.2.5"
mkdocs-awesome-pages-plugin = "^2.6.1"
mkdocs = "^1.2.3"
mkdocs-material = "^8.1.2"
mkdocs-simple-hooks = "^0.1.4"
pymarkdown = "^0.1.4"
pymdown-extensions = "^9.1"
types-requests = "^2.27.29"
flake8 = "^6.0.0"
black = "^22.12.0"
pytest-cov = "^5.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 100
skip-string-normalization = true

[tool.flake8]
ignore = "E503,E501"
line-length = 100
