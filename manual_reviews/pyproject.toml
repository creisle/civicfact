[tool.poetry]
name = "manual review"
version = "0.1.0"
description = ""
authors = ["Caralyn Reisle <creisle@bcgsc.ca>"]
packages = [
    { include = "doccano", from = "src" },
    { include = "iaa", from = "src" },
    { include = "article_utils", from= "./../data_builder/src/"},
    { include = "figutils", from= "./../data_builder/src"}
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
requests = "<2.29.0"
pandas = "^2.2.3"
numpy = "^1.21.4"
matplotlib = "^3.5.0"
seaborn = "^0.13.2"
beautifulsoup4 = "^4.11.1"
Unidecode = "^1.3.4"
xmltodict = "^0.13.0"
backoff = "^2.2.1"
scipy = "^1.10.1"
UpSetPlot = "^0.8.0"
jupyter = "^1.0.0"
python-dotenv = "^1.0.1"
thefuzz = "^0.22.1"
tqdm = "^4.66.4"
doccano-client = "^1.2.8"
scikit-learn = "^1.6.1"
irrcac = "^0.4.4"
pingouin = "^0.5.5"
pysbd = "^0.3.4"
bioc = "^2.1"
requests-cache = "^1.2.1"
bioconverters = {path = "../bioconverters/bioconverters-1.0.3.tar.gz"}
ratelimit = "^2.2.1"

[tool.poetry.group.dev.dependencies]
dd = "^0.5.6"
isort = "^5.10.1"
pytest = "^6.2.5"
types-requests = "^2.27.29"
flake8 = "^6.0.0"
black = "^22.12.0"
pytest-cov = "^5.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 100
skip-string-normalization = true

[tool.flake8]
ignore = "E503,E501"
line-length = 100
